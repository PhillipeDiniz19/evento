<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem do Dia | CGDF</title>
    <meta name="description"
        content="Descubra a mensagem que a vida tem para você hoje com o biscoito da sorte da CGDF.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #b44c2c;
            --secondary: #ee9b4d;
            --bg: #f8d7b0;
            --text: #2d1a0e;
            --white: #ffffff;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Outfit', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg);
            background-image: radial-gradient(#00000005 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: var(--font-sans);
            color: var(--text);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #sorte-page {
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .headline {
            margin-bottom: 30px;
            z-index: 10;
        }

        .h-pre {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            margin-bottom: 5px;
        }

        .h-main {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            color: var(--primary);
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .h-main .icon {
            font-size: 0.6em;
            color: var(--secondary);
        }

        .h-sub {
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .h-sub .vida {
            color: var(--primary);
            position: relative;
        }

        .h-sub .vida::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--secondary);
            border-radius: 2px;
        }

        .h-sub .star {
            color: var(--secondary);
            font-size: 0.8em;
        }

        .separator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 20px auto 30px;
        }

        .separator span {
            flex: 1;
            height: 1px;
            border-top: 2px dashed var(--primary);
            opacity: 0.4;
        }

        .separator .heart {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .cookie-area {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 500px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .cookie-container {
            margin-top: 150px;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hand {
            position: absolute;
            width: 550px;
            height: auto;
            z-index: 3;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            top: 50%;
        }

        .hand-left {
            left: 40%;
            transform: translate(-100%, -50%);
        }

        .hand-right {
            left: 49%;
            transform: translate(0%, -50%);
        }

        .aberto .hand-left {
            transform: translate(-130%, -50%);
        }

        .aberto .hand-right {
            transform: translate(30%, -50%);
        }

        .cookie-parts {
            position: relative;
            width: 320px;
            height: 220px;
            cursor: pointer;
            z-index: 5;
        }

        .cookie-part {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
        }

        .cookie-left {
            opacity: 0;
        }

        .cookie-right {
            opacity: 0;
        }

        /* ── MODAL DA MENSAGEM ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 26, 14, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg);
            background-image: radial-gradient(#00000005 1px, transparent 1px);
            background-size: 20px 20px;
            width: min(550px, 90vw);
            padding: 60px 40px;
            border-radius: 30px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.8) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            border: 3px solid var(--secondary);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            z-index: 10;
        }

        .modal-close:hover {
            transform: scale(1.1) rotate(90deg);
        }

        .modal-msg {
            font-family: var(--font-serif);
            font-style: italic;
            font-weight: 700;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .modal-footer {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            opacity: 0.8;
        }

        /* ── CONFETES ── */
        .confete {
            position: fixed;
            z-index: 2000;
            pointer-events: none;
            border-radius: 2px;
        }

        .btn-wrap {
            margin-top: 20px;
        }

        #btn-abrir {
            background-color: var(--secondary);
            color: var(--text);
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 700;
            padding: 12px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #d68032, 0 15px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        #btn-abrir:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #d68032, 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        #btn-abrir:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #d68032, 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        #btn-abrir span {
            font-size: 1.2rem;
        }

        #btn-novo {
            margin-top: 25px;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 25px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            transition: all 0.3s;
        }

        #btn-novo:hover {
            background: var(--primary);
            color: white;
        }

        .footer-logos {
            width: 100%;
            margin-top: auto;
            padding: 30px 20px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .footer-separator {
            width: 100%;
            max-width: 500px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.25;
            margin: 0 auto 10px;
        }

        .footer-logos {
            width: 100%;
            margin-top: auto;
            padding: 40px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .footer-logos img {
            max-height: 100px;
            width: auto;
            object-fit: contain;
        }

        .footer-logos img.logo-maior {
            max-height: 315px;
        }

        @keyframes shake {

            0%,
            100% {
                transform: rotate(0);
            }

            25% {
                transform: rotate(-3deg);
            }

            75% {
                transform: rotate(3deg);
            }
        }

        .shaking .cookie-parts {
            animation: shake 0.1s infinite;
        }

        .sparkle {
            color: var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(0.8);
            }
        }

        /* ── RESPONSIVO ── */

        /* Tablet landscape / small desktop: 900px–1199px */
        @media (max-width: 1199px) {
            .hand {
                width: 460px;
            }

            .cookie-area {
                height: 440px;
            }
        }

        /* Tablet portrait: 768px–899px */
        @media (max-width: 899px) {
            .hand {
                width: 380px;
            }

            .cookie-area {
                height: 380px;
            }

            .cookie-container {
                margin-top: 60px;
            }

            .hand-left {
                left: 46%;
                transform: translate(-108%, -50%);
            }

            .aberto .hand-left {
                transform: translate(-148%, -50%);
            }

            .aberto .hand-right {
                transform: translate(48%, -50%);
            }
        }

        /* Mobile large: 600px–767px */
        @media (max-width: 767px) {
            #sorte-page {
                padding: 30px 15px;
                justify-content: flex-start;
                padding-top: 50px;
            }

            .headline {
                margin-bottom: 20px;
            }

            .h-main {
                gap: 8px;
                flex-wrap: wrap;
            }

            .separator {
                margin: 15px auto 20px;
            }

            .btn-wrap {
                margin-top: 10px;
            }

            #btn-abrir {
                font-size: 1.2rem;
                padding: 10px 30px;
                gap: 10px;
            }

            .hand {
                width: 300px;
            }

            .cookie-area {
                height: 320px;
                max-width: 100%;
                margin-bottom: 20px;
            }

            .cookie-container {
                margin-top: 40px;
            }

            .hand-left {
                left: 46%;
                transform: translate(-108%, -50%);
            }

            .aberto .hand-left {
                transform: translate(-150%, -50%);
            }

            .aberto .hand-right {
                transform: translate(50%, -50%);
            }

            .modal-content {
                padding: 50px 25px;
                border-radius: 20px;
            }

            .footer-logos {
                padding: 20px 10px;
                gap: 30px;
            }

            .footer-logos img {
                height: 45px;
            }

            .footer-logos img.logo-small {
                height: 30px;
            }
        }

        /* Mobile small: até 479px */
        @media (max-width: 479px) {
            #sorte-page {
                padding: 35px 12px;
            }

            .h-main {
                font-size: clamp(2rem, 10vw, 2.8rem);
            }

            .h-sub {
                font-size: clamp(1rem, 4vw, 1.2rem);
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }

            #btn-abrir {
                font-size: 1rem;
                padding: 10px 22px;
            }

            .hand {
                width: 220px;
            }

            .cookie-area {
                height: 260px;
            }

            .cookie-container {
                margin-top: 30px;
            }

            .hand-left {
                left: 46%;
                transform: translate(-110%, -50%);
            }

            .aberto .hand-left {
                transform: translate(-155%, -50%);
            }

            .aberto .hand-right {
                transform: translate(55%, -50%);
            }

            .modal-content {
                padding: 45px 20px;
            }

            .modal-msg {
                font-size: clamp(1.2rem, 5vw, 1.6rem);
                margin-bottom: 20px;
            }
        }

        /* Mobile extra small: até 360px */
        @media (max-width: 360px) {
            .hand {
                width: 185px;
            }

            .cookie-area {
                height: 220px;
            }

            #btn-abrir {
                font-size: 0.9rem;
                padding: 9px 18px;
            }
        }
    </style>
</head>

            var container = document.getElementById('cookie-container');
            var modal = document.getElementById('modal-msg');
            var texto = document.getElementById('texto-sorte');
            var btnA = document.getElementById('btn-abrir');
            var btnN = document.getElementById('btn-novo');
            var animando = false;

            window.abrirBiscoito = function () {
                if (animando || container.classList.contains('aberto')) return;
                animando = true;

                container.classList.add('shaking');

                setTimeout(function () {
                    container.classList.remove('shaking');
                    container.classList.add('aberto');

                    texto.textContent = mensagens[Math.floor(Math.random() * mensagens.length)];

                    setTimeout(function () {
                        modal.style.display = 'flex';
                        // force reflow for transition
                        modal.offsetHeight;
                        modal.classList.add('active');
                        lancarConfetes();
                    }, 500);

                    btnA.style.display = 'none';
                    btnN.style.display = 'inline-block';
                    animando = false;
                }, 600);
            };

            window.fecharModal = function () {
                modal.classList.remove('active');
                setTimeout(function () {
                    modal.style.display = 'none';
                }, 400);
            };

            window.novoBiscoito = function () {
                fecharModal();
                container.classList.remove('aberto');
                btnN.style.display = 'none';
                btnA.style.display = 'flex';
                setTimeout(function () {
                    animando = false;
                }, 700);
            };

            // Fecha modal clicando fora
            modal.addEventListener('click', function (e) {
                if (e.target === modal) fecharModal();
            });

            function lancarConfetes() {
                var cores = ['#b44c2c', '#ee9b4d', '#f8d7b0', '#ffffff', '#2d1a0e', '#fad070'];
                for (var i = 0; i < 150; i++) {
                    (function () {
                        var confete = document.createElement('div');
                        confete.className = 'confete';
                        var cor = cores[Math.floor(Math.random() * cores.length)];
                        var size = Math.random() * 10 + 5;
                        confete.style.backgroundColor = cor;
                        confete.style.width = size + 'px';
                        confete.style.height = size + 'px';
                        confete.style.left = '50%';
                        confete.style.top = '50%';
                        document.body.appendChild(confete);

                        var angle = Math.random() * Math.PI * 2;
                        var velocity = Math.random() * 20 + 10;
                        var vx = Math.cos(angle) * velocity;
                        var vy = Math.sin(angle) * velocity - 10;
                        var x = 0, y = 0, g = 0.5, o = 1, r = Math.random() * 360;

                        function update() {
                            x += vx; y += vy; vy += g; o -= 0.012; r += 7;
                            confete.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + r + 'deg)';
                            confete.style.opacity = o;
                            if (o > 0 && y < window.innerHeight) {
                                requestAnimationFrame(update);
                            } else {
                                confete.remove();
                            }
                        }
                        requestAnimationFrame(update);
                    })();
                }
            }
        })();
    </script>
